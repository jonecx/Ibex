# Builds the minified release APK and publishes size-over-time charts to GitHub
# Pages via benchmark-action/github-action-benchmark (gh-pages branch, /dev/apk-size).
# No emulator needed, so this is a fast job separate from the macrobenchmark run.
name: APK Size

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Share one group with the Benchmarks workflow so gh-pages writes never race.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk-size:
    name: Release APK size
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create local.properties
        run: |
          echo "POSTHOG_API_KEY=" >> local.properties
          echo "POSTHOG_HOST=https://us.i.posthog.com" >> local.properties

      # Sentry mapping/source uploads self-disable without SENTRY_AUTH_TOKEN (see app/build.gradle.kts).
      - name: Assemble minified release
        run: ./gradlew :app:assembleRelease

      - name: Measure APK size for github-action-benchmark
        run: python3 benchmarks/apk_size_to_gha.py --apk app/build/outputs/apk/release/app-release.apk --output apk-size-gha.json

      - name: Publish APK size charts
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Ibex APK Size
          tool: customSmallerIsBetter
          output-file-path: apk-size-gha.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: dev/apk-size
          alert-threshold: 110%
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 150
