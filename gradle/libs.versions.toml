espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.2"
kotlin = "2.2.10"
composeBom = "2026.04.01"
material3Adaptive = "1.1.0"
navigation = "2.8.4"
coil = "2.6.0"
lifecycleViewmodelCompose = "2.8.7"
koin = "4.1.0"
datastore = "1.1.1"
timber = "5.0.1"
posthog = "3.56.7"
sentry = "8.51.0"
